<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>CoView</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
    <header>
        <div class="brand">C</div>
        <div>
            <strong>CoView 浮窗</strong>
            <span id="status">读取中</span>
        </div>
    </header>
    <section id="details" class="details"></section>
    <div class="actions">
        <button id="toggle" type="button">启用</button>
        <button id="clear" type="button" class="secondary">清除配对</button>
    </div>
    <p class="hint">先打开 CoView 房主房间，扩展会自动配对。之后在视频网页中会自动显示浮窗。</p>
</main>
<script src="popup.js"></script>
</body>
</html>
